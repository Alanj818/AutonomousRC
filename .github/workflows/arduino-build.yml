name: ESP32 + Bluepad32 Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

      - name: Setup Bluepad32 ESP32 core
        run: |
          ./bin/arduino-cli config init
          ./bin/arduino-cli config add board_manager.additional_urls \
          https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json

          ./bin/arduino-cli core update-index
          ./bin/arduino-cli core install esp32_bluepad32:esp32

      - name: Compile
        run: |
          ./bin/arduino-cli compile \
          --fqbn esp32_bluepad32:esp32:esp32s3 \
          AutonomousRC
