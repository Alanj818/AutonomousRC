name: ESP32 + Bluepad32

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh

      - name: Show available cores
        run: |
          ./bin/arduino-cli core search bluepad
          ./bin/arduino-cli core search esp32

      - name: Setup board packages
        run: |
          ./bin/arduino-cli config init

          ./bin/arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

          ./bin/arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/ricardoquesada/esp32-arduino-lib-builder/master/bluepad32_files/package_esp32_bluepad32_index.json

          ./bin/arduino-cli core update-index

          # Install the Bluepad32-modified ESP32 core
          ./bin/arduino-cli core install arduino:esp32
        

      - name: Compile
        run: |
          ./bin/arduino-cli compile \
            --fqbn arduino:esp32:esp32wrover \
            AutonomousRC
